l_english:
 mlhu_unify_homeland: "Unify Your Home Lands"
 mlhu_unify_homeland_BUTTON_TOOLTIP: "Our people live in lands we do not rule. Bring them under one banner."
 mlhu_unify_homeland_BUTTON_DETAILS: ""
 mlhu_unify_homeland_DESCRIPTION: "Across the hills and valleys around us live people who speak our tongue, honour our gods and share our ancestors, yet they answer to other masters. Every territory where our people are the majority is part of our homeland, and it is time to unite it."
 mlhu_unify_homeland_CRITERIA_DESCRIPTION: "This mission is complete when we own at least 90% of the territories where our primary culture held the majority when the mission began."
 mlhu_unify_homeland_REWARD_DESCRIPTION: "A permanent bonus to the happiness of our own people, stability, diplomatic reputation and morale."
 mlhu_cooldown_tt: "We will not be able to take this mission again for #Y 20#! years."

 mlhu_task_1: "Call of Kinship"
 mlhu_task_1_DESC: "Proclaim to all our kin that we are the rightful protectors of our people, and lay claim to every land where they are the majority."
 mlhu_task_1_tt: "We gain a #Y claim#! on every homeland territory we do not own."

 mlhu_task_2: "Secure the Heartland"
 mlhu_task_2_DESC: "Words are not enough. We must hold a real share of our homeland before others take us seriously."
 mlhu_task_2_req_tt: "We own at least #Y 25%#! of our homeland territories."

 mlhu_task_3: "Bonds of Blood"
 mlhu_task_3_DESC: "Not every kin state must be conquered. An alliance or a loyal subject of our own people strengthens our claim to lead them."
 mlhu_task_3_req_tt: "Another nation with our primary culture is our #Y ally#! or #Y subject#!."

 mlhu_task_4: "Heart of Our People"
 mlhu_task_4_DESC: "A great people needs a great capital, a city where our kin will gather and thrive."
 mlhu_task_4_req_tt: "Our capital has at least #Y 20#! pops."

 mlhu_task_5: "Half the Homeland"
 mlhu_task_5_DESC: "Half of our people now live under our rule. Let the rest know we have not forgotten them."
 mlhu_task_5_req_tt: "We own at least #Y 50%#! of our homeland territories."

 mlhu_task_6: "Kin Under One Roof"
 mlhu_task_6_DESC: "Only scattered pockets of our people remain outside our borders. Bind the lands we hold together and bring in the last."
 mlhu_task_6_req_tt: "We own at least #Y 75%#! of our homeland territories."

 mlhu_task_7: "The Homeland United"
 mlhu_task_7_DESC: "For the first time in memory, our people stand united under one rule. Our ancestors would be proud."
 mlhu_task_7_req_tt: "We own at least #Y 90%#! of our homeland territories."

 mlhu_rallied_kin: "Rallied Kin"
 mlhu_bonds_of_blood: "Bonds of Blood"
 mlhu_heart_of_the_people: "Heart of the People"
 mlhu_kin_under_one_roof: "Kin Under One Roof"
 mlhu_homeland_united: "Homeland United"
