l_english:
 mlhu_unify_homeland: "Unify Your Home Lands"
 mlhu_unify_homeland_BUTTON_TOOLTIP: "Our people live in lands of our region we do not rule. Bring them under one banner."
 mlhu_unify_homeland_BUTTON_DETAILS: ""
 mlhu_unify_homeland_DESCRIPTION: "Across the hills and valleys around us live people who speak our tongue, honour our gods and share our ancestors, yet they answer to other masters. Every territory of our capital's region where our people are the majority is part of our homeland, and it is time to unite it. (Our people are the culture of our capital; if it has no kin left to unite in the region, our ruling culture is used instead.)"
 mlhu_unify_homeland_CRITERIA_DESCRIPTION: "This mission is complete when we own at least 90% of the territories of our capital's region where our people held the majority when the mission began."
 mlhu_unify_homeland_REWARD_DESCRIPTION: "A permanent bonus to the happiness of our own people, stability, diplomatic reputation and morale."
 mlhu_cooldown_tt: "We will not be able to take this mission again for #Y 20#! years."

 mlhu_task_1: "Call of Kinship"
 mlhu_task_1_DESC: "Proclaim to all our kin that we are the rightful protectors of our people, and lay claim to every land where they are the majority. Spreading the word takes a year."
 mlhu_task_1_tt: "We gain a #Y claim#! on every homeland territory we do not own."

 mlhu_task_2: "Secure the Heartland"
 mlhu_task_2_DESC: "Words are not enough. We must hold a real share of our homeland, and keep it for a year, before others take us seriously."
 mlhu_task_2_req_tt: "We own at least #Y 25%#! of our homeland territories (now: #Y [Player.MakeScope.Var('mlhu_owned_pct').GetValue|0]%#!, checked monthly)."

 mlhu_task_3: "Bonds of Blood"
 mlhu_task_3_DESC: "Not every neighbour must be conquered. A trusted ally or a loyal subject, kept for a year, strengthens our claim to lead our people."
 mlhu_task_3_req_tt: "Another nation is our #Y ally#! or #Y subject#!."

 mlhu_task_4: "Heart of Our People"
 mlhu_task_4_DESC: "A great people needs a great capital, a city where our kin will gather and thrive. Making it so takes a year."
 mlhu_task_4_req_tt: "Our capital has at least #Y 20#! pops."

 mlhu_task_5: "Half the Homeland"
 mlhu_task_5_DESC: "Half of our people now live under our rule. Let the rest know we have not forgotten them."
 mlhu_task_5_req_tt: "We own at least #Y 50%#! of our homeland territories (now: #Y [Player.MakeScope.Var('mlhu_owned_pct').GetValue|0]%#!, checked monthly)."

 mlhu_task_6: "Kin Under One Roof"
 mlhu_task_6_DESC: "Only scattered pockets of our people remain outside our borders. Bind the lands we hold together and bring in the last."
 mlhu_task_6_req_tt: "We own at least #Y 75%#! of our homeland territories (now: #Y [Player.MakeScope.Var('mlhu_owned_pct').GetValue|0]%#!, checked monthly)."

 mlhu_task_7: "The Homeland United"
 mlhu_task_7_DESC: "For the first time in memory, our people stand united under one rule. Our ancestors would be proud."
 mlhu_task_7_req_tt: "We own at least #Y 90%#! of our homeland territories (now: #Y [Player.MakeScope.Var('mlhu_owned_pct').GetValue|0]%#!, checked monthly)."

 mlhu_rallied_kin: "Rallied Kin"
 mlhu_bonds_of_blood: "Bonds of Blood"
 mlhu_heart_of_the_people: "Heart of the People"
 mlhu_kin_under_one_roof: "Kin Under One Roof"
 mlhu_homeland_united: "Homeland United"

 mlhu.11.t: "The Call of Kinship"
 mlhu.11.desc: "For a full year our heralds have travelled the roads of our homeland, telling every village and town of our people that we are their rightful protectors. Now the whole region knows our claim."
 mlhu.11.a: "Our people will be one."
 mlhu.12.t: "The Heartland Secured"
 mlhu.12.desc: "A quarter of our homeland has been under our rule for a year now. Our kin beyond the border look to us with new hope."
 mlhu.12.a: "This is only the beginning."
 mlhu.13.t: "Bonds of Blood"
 mlhu.13.desc: "A year of loyal friendship has shown everyone that we keep faith with those who stand beside us."
 mlhu.13.a: "Friends are worth more than gold."
 mlhu.14.t: "Heart of Our People"
 mlhu.14.desc: "After a year of building, our capital has become the heart of our people, a city where our kin gather from every corner of the homeland."
 mlhu.14.a: "Let it grow ever greater."
 mlhu.15.t: "Half the Homeland"
 mlhu.15.desc: "Half of our people now live under our rule. We have not forgotten the rest, and we renew our claim to every land where they live."
 mlhu.15.a: "Onward."
 mlhu.16.t: "Kin Under One Roof"
 mlhu.16.desc: "Only scattered pockets of our people remain outside our borders. The lands we hold are being bound together into one."
 mlhu.16.a: "Almost there."
 mlhu.17.t: "The Homeland United"
 mlhu.17.desc: "For the first time in memory, our people stand united under one rule. Our ancestors would be proud."
 mlhu.17.a: "Glory to our people!"
